<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t">
<title id="t">Ved-u's skill radar: Arrays &amp; Hashing 505, Strings 239, Two Pointers 114, Search &amp; Sort 130, Stacks &amp; Heaps 64, Trees 62, Graphs 54, Dynamic Programming 88</title>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}.title{fill:#1f2328;font-size:18px;font-weight:600}.muted{fill:#656d76;font-size:12px}
.label{fill:#1f2328;font-size:13px;font-weight:600}.value{fill:#1f2328;font-size:22px;font-weight:700}.value-sm{fill:#1f2328;font-size:14px;font-weight:700}
.total{fill:#1f2328;font-size:30px;font-weight:700}.track{fill:#eaeef2}.ring-track{stroke:#eaeef2}.divider{stroke:#d0d7de}.grid{stroke:#d0d7de;fill:none}
@media (prefers-color-scheme: dark){.bg{fill:#0d1117;stroke:#30363d}.title,.label,.value,.value-sm,.total{fill:#e6edf3}.muted{fill:#8b949e}.track{fill:#21262d}.ring-track{stroke:#21262d}.divider{stroke:#30363d}.grid{stroke:#30363d}}
@keyframes ls-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ls-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ls-pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes ls-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.fade{animation:ls-fade .6s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:ls-grow .9s cubic-bezier(.2,.7,.3,1) both}
.pulse{animation:ls-pulse 1.8s ease-in-out infinite}
.d1{animation-delay:0.12s}
.d2{animation-delay:0.24s}
.d3{animation-delay:0.36s}
.d4{animation-delay:0.48s}
.d5{animation-delay:0.60s}
.d6{animation-delay:0.72s}
.d7{animation-delay:0.84s}
.d8{animation-delay:0.96s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.shape{transform-origin:320px 232px;animation:ls-pop 1s cubic-bezier(.2,.7,.3,1) both}
